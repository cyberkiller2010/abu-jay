<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gallery - ABU JAY</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0a0a0f;
            color: #ffffff;
            min-height: 100vh;
            padding: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid rgba(108, 43, 217, 0.15);
            padding-bottom: 16px;
        }

        .header-left h1 {
            font-size: 28px;
            color: #c084fc;
            letter-spacing: 1px;
        }

        .header-left h1 span {
            color: #ffffff;
        }

        .header-left .subtitle {
            color: rgba(255, 255, 255, 0.2);
            font-size: 14px;
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        button:active {
            transform: scale(0.95);
            opacity: 0.7;
        }

        .btn-success {
            background: #22c55e;
            color: #ffffff;
            border: none;
        }

        .btn-danger {
            background: rgba(248, 113, 113, 0.1);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.1);
        }

        .btn-primary {
            background: #6c2bd9;
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 20px rgba(108, 43, 217, 0.2);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .gallery-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(108, 43, 217, 0.06);
            position: relative;
            transition: all 0.2s;
        }
        .gallery-item:active {
            transform: scale(0.97);
        }

        .gallery-item img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }

        .gallery-item .info {
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.15);
            font-family: monospace;
        }

        .gallery-item .info .label {
            color: #c084fc;
            font-weight: 600;
        }

        .gallery-item .delete-btn {
            background: rgba(248, 113, 113, 0.1);
            border: none;
            color: #f87171;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .gallery-item .delete-btn:active {
            background: rgba(248, 113, 113, 0.2);
        }

        .empty {
            text-align: center;
            color: rgba(255, 255, 255, 0.1);
            padding: 60px 0;
            font-size: 18px;
        }
        .empty small {
            color: rgba(255, 255, 255, 0.05);
            font-size: 14px;
            display: block;
            margin-top: 8px;
        }

        .empty .btn-primary {
            margin-top: 16px;
        }

        .photo-count {
            text-align: center;
            color: rgba(255, 255, 255, 0.1);
            font-size: 13px;
            margin-top: 16px;
        }
        .photo-count span {
            color: #c084fc;
        }

        .loading-spinner {
            display: none;
            width: 32px;
            height: 32px;
            border: 3px solid rgba(108, 43, 217, 0.15);
            border-top-color: #6c2bd9;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        .loading-spinner.show {
            display: block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            .header-left h1 {
                font-size: 22px;
            }
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 10px;
            }
            button {
                padding: 8px 14px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <h1><span>ABU</span> JAY</h1>
            <p class="subtitle">All photos from Supabase</p>
        </div>
        <div class="header-actions">
            <button class="btn-primary" id="refreshBtn">Refresh</button>
            <button class="btn-danger" id="clearBtn">Clear All</button>
        </div>
    </div>

    <div id="gallery"></div>

    <div class="photo-count">
        <span id="countDisplay">0</span> photos in Supabase
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <script>
        (function() {
            'use strict';

            const SUPABASE_URL = 'https://bnslykqanegcicpdddzj.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_opxwfbItjYqgtUjk1T7T1A_OwzE4q6w';
            const BUCKET_NAME = 'photos';

            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const container = document.getElementById('gallery');
            const countDisplay = document.getElementById('countDisplay');

            async function loadGallery() {
                container.innerHTML = `
                    <div style="text-align:center; padding: 40px 0; color: rgba(255,255,255,0.2);">
                        <div class="loading-spinner show"></div>
                        Loading photos...
                    </div>
                `;

                try {
                    const { data, error } = await supabase.storage
                        .from(BUCKET_NAME)
                        .list('public');

                    if (error) {
                        throw new Error(error.message);
                    }

                    if (!data || data.length === 0) {
                        container.innerHTML = `
                            <div class="empty">
                                No photos yet
                                <small>Open capture page to take photos</small>
                                <br>
                                <a href="index.html" target="_blank" class="btn-primary" style="display:inline-block; padding:12px 24px; border-radius:12px; text-decoration:none; color:#ffffff; background:#6c2bd9; margin-top:12px;">
                                    Take Photo
                                </a>
                            </div>
                        `;
                        countDisplay.textContent = '0';
                        return;
                    }

                    const images = data.filter(file =>
                        file.name.match(/\.(jpg|jpeg|png|gif|webp)$/i)
                    );

                    if (images.length === 0) {
                        container.innerHTML = `
                            <div class="empty">
                                No image files found
                            </div>
                        `;
                        countDisplay.textContent = '0';
                        return;
                    }

                    let html = '<div class="gallery-grid">';
                    images.forEach((file) => {
                        const publicUrl = supabase.storage
                            .from(BUCKET_NAME)
                            .getPublicUrl('public/' + file.name).data.publicUrl;

                        let label = 'Photo';
                        if (file.name.toLowerCase().includes('front')) label = 'Front';
                        else if (file.name.toLowerCase().includes('back')) label = 'Back';

                        html += `
                            <div class="gallery-item">
                                <img src="${publicUrl}" 
                                     alt="${file.name}" 
                                     loading="lazy"
                                     onclick="window.open('${publicUrl}', '_blank')">
                                <div class="info">
                                    <span><span class="label">${label}</span></span>
                                    <button class="delete-btn" data-path="public/${file.name}">X</button>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                    container.innerHTML = html;

                    countDisplay.textContent = images.length;

                    document.querySelectorAll('.delete-btn').forEach(btn => {
                        btn.addEventListener('click', async function(e) {
                            e.stopPropagation();
                            const path = this.dataset.path;
                            if (confirm('Delete this photo?')) {
                                try {
                                    const { error } = await supabase.storage
                                        .from(BUCKET_NAME)
                                        .remove([path]);
                                    if (error) throw error;
                                    loadGallery();
                                } catch (err) {
                                    alert('Delete failed: ' + err.message);
                                }
                            }
                        });
                    });

                } catch (err) {
                    container.innerHTML = `
                        <div class="empty" style="color: #f87171;">
                            Error: ${err.message}
                            <br>
                            <button class="btn-primary" style="margin-top:12px;" onclick="loadGallery()">Retry</button>
                        </div>
                    `;
                    console.error('Gallery error:', err);
                }
            }

            async function clearAll() {
                if (!confirm('Delete ALL photos from Supabase?')) return;

                try {
                    const { data, error } = await supabase.storage
                        .from(BUCKET_NAME)
                        .list('public');

                    if (error) throw error;
                    if (!data || data.length === 0) {
                        alert('No photos to delete');
                        return;
                    }

                    const filesToDelete = data.map(file => 'public/' + file.name);
                    const { error: deleteError } = await supabase.storage
                        .from(BUCKET_NAME)
                        .remove(filesToDelete);

                    if (deleteError) throw deleteError;

                    alert('Deleted ' + filesToDelete.length + ' photos!');
                    loadGallery();

                } catch (err) {
                    alert('Error: ' + err.message);
                }
            }

            document.getElementById('refreshBtn').addEventListener('click', loadGallery);
            document.getElementById('clearBtn').addEventListener('click', clearAll);

            window.addEventListener('load', loadGallery);

            console.log('ABU JAY Gallery loaded — fetching from Supabase');

        })();
    </script>

</body>
</html>
